[project]
name = "ai-daily-podcast"
version = "2.0.0"
description = "A daily news podcast produced end-to-end by an AI agent, powered by the Aixy gateway."
readme = "README.md"
authors = [{ name = "Óscar Caballero", email = "atom-flaxseed-fame@duck.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.10",
    "mcp>=2.3",
    "openai>=1.60",
    "pydantic>=2.7",
    "pydub>=0.25.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
repository = "https://github.com/oscarcpozas/ai-daily-podcast"
aixy = "https://aixy-gateway.com"

[project.scripts]
daily-podcast = "daily_podcast.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_podcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# Spanish prompts and copy use typographic characters on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]
